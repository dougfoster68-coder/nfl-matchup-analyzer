name: Weekly report card

# Tuesday 11 AM ET (15:00 UTC during daylight time, 10 AM ET after the November clock change),
# after Monday Night Football and the overnight stats update.
on:
  schedule:
    - cron: "0 15 * * 2"
  workflow_dispatch:
    inputs:
      week:
        description: "Week number (blank = most recent completed week)"
        required: false

permissions:
  contents: write   # retune commits model_params.json (main) and re-rated weeks (data branch)
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Load data branch
        run: |
          git fetch --depth=1 origin data
          git worktree add data FETCH_HEAD

      - name: Build report
        id: build
        run: |
          python nfl_matchup.py --refresh report --snapshot-dir data/snapshots --markdown report.md \
            ${{ github.event.inputs.week && format('--week {0}', github.event.inputs.week) || '' }} | tee out.txt
          echo "title=$(grep '^TITLE=' out.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      # Re-fit the model settings on every finished week; switch only if they also win on the 3 newest weeks
      - name: Retune model
        run: python nfl_matchup.py retune --snapshot-dir data/snapshots --markdown retune.md

      - name: Save retune
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- model_params.json || [ -n "$(git status --porcelain model_params.json)" ]; then
            git add model_params.json
            git commit -m "Weekly retune $(TZ=America/New_York date '+%a %b %d')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          cd data
          git add -A rerated walkforward
          if ! git diff --cached --quiet; then
            git commit -q -m "Retune backtests $(TZ=America/New_York date '+%a %b %d')"
            git pull -q --rebase origin data
            git push origin HEAD:data
          fi

      - name: Post as issue
        if: steps.build.outputs.title != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Tids Takedowns — ${{ steps.build.outputs.title }}"
        run: |
          {
            echo "📊 Full report card: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/"
            echo
            cat report.md
            if [ -f retune.md ]; then echo; cat retune.md; fi
          } > body.md
          num=$(gh issue list --state all --search "\"$TITLE\" in:title" --json number,title \
                -q ".[] | select(.title == env.TITLE) | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
