name: Refresh dashboard

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay scheduled runs at busy times)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # autobet commits bets.json back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # nflverse stats only change after games; keep the downloads between runs
      - uses: actions/cache@v4
        with:
          path: cache
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      # Claude's paper bets: the week-start bankroll on the best plays; each game bet in the 3 hours before kickoff
      - name: Place paper bets
        run: python nfl_matchup.py autobet --bankroll-pct 1.0

      - name: Save new bets
        run: |
          if ! git diff --quiet bets.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bets.json
            git commit -m "Paper bets placed $(TZ=America/New_York date '+%a %b %d %I:%M %p ET')"
            git push
          fi

      # Pre-kickoff rating snapshots live on the 'data' branch (keeps main's history clean)
      - name: Load data branch
        run: |
          git fetch --depth=1 origin data
          git worktree add data FETCH_HEAD

      # % of bets vs % of money before each kickoff; a scrape failure shouldn't block the dashboard
      - name: Capture betting splits
        run: python nfl_matchup.py splits --snapshot-dir data/splits --quiet || echo "::warning::splits capture failed"

      - name: Build dashboard and report cards
        run: |
          python nfl_matchup.py week --html site/index.html --snapshot-dir data/snapshots
          python nfl_matchup.py report --snapshot-dir data/snapshots --out site/reports

      - name: Save snapshots
        working-directory: data
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "Rating snapshot $(TZ=America/New_York date '+%a %b %d %I:%M %p ET')"
            git push origin HEAD:data
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
